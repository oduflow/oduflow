# ── Server ────────────────────────────────────────────
[server]
bind = "0.0.0.0"                 # listener address; legacy key "host" is still accepted
port = 8000
allow_local_path = true        # trusted single-user local development; disable on hosted/multi-user servers
# allow_insecure_http = false  # serve HTTP /mcp with NO auth (only behind your own proxy)
# trace = false                    # verbose tracing for git analysis & env ops

# ── Routing ───────────────────────────────────────────
[routing]
mode = "port"                   # "port" | "traefik"
# acme_email = "admin@example.com"  # required for traefik (when tls = true)
# tls = true                       # traefik only. true: Traefik terminates TLS
#                                  # (:443, HTTP->HTTPS redirect, Let's Encrypt).
#                                  # false: plain HTTP on :80 only, no redirect/ACME —
#                                  # for a TLS-terminating upstream (e.g. Cloudflare
#                                  # tunnel). Public URLs stay https:// either way.
#                                  # Deploy-time choice: flipping it on a live server
#                                  # requires recreating existing environments/services
#                                  # (their routing labels are fixed at creation).
# public_scheme = "https"          # scheme of every URL Oduflow hands out (dashboard
#                                  # links, MCP endpoints, share links). Default:
#                                  # https in traefik mode, http in port mode. Set
#                                  # "http" with tls = false when NOTHING terminates
#                                  # TLS in front, so the links are reachable (this
#                                  # also stops Traefik trusting X-Forwarded-* on :80).
#                                  # Can be overridden per team ([team.X] public_scheme)
#                                  # to mix a plain-HTTP LAN team with a team behind a
#                                  # TLS-terminating upstream (e.g. Cloudflare tunnel).

# ── Extra routes (traefik only) ───────────────────────
# Forward an external hostname to an arbitrary upstream URL for a service that
# Oduflow does not manage (its own Docker container, a host process, etc.).
# Each [route.<name>] gets a Traefik router + Let's Encrypt cert (when tls=true).
# http://127.0.0.1 / http://localhost in url means "on the Docker host" (auto-resolved).
# For anything more advanced than host→URL, drop your own *.yml into the Traefik
# dynamic directory instead — see docs/traefik.md.
# [route.legacy-api]
# host = "api.example.com"
# url  = "http://127.0.0.1:3000"

# ── Database ──────────────────────────────────────────
[database]
user = "odoo"
# password auto-generated on first launch. Set explicitly to override.
image = "postgres:15"

# ── Storage ───────────────────────────────────────────
[storage]
# data_dir = "/srv/oduflow"       # default: /srv/oduflow or ~/.oduflow/data
overlay_threshold_mb = 50         # filestore size limit for overlay vs copy

# ── Lifecycle ─────────────────────────────────────────
# Automatic management of idle/stopped environments (0 disables either behavior).
# Protected environments are always exempt.
[lifecycle]
auto_stop_hours = 48              # stop idle environments after N hours (non-destructive)
auto_delete_hours = 0             # delete stopped environments after N hours (DESTRUCTIVE; opt-in)

# ── Coding agent ──────────────────────────────────────
# One agent container per team (Claude Code + OpenAI Codex + OpenCode), driven
# from the dashboard: "Agent Chat" (structured browser chat) and "Agent CLI"
# (terminal). The agent holds a git checkout per environment and reaches
# environments only through the Oduflow MCP server. It is a HOSTING feature —
# enable it per team (agent_enabled, below); local developers use their own
# agents, so it is off by default. This global section holds only
# deployment-wide bits; changes apply on server restart (the agent container
# is recreated automatically when its config changed).
# [agent]
# image = "oduist/oduflow-coder:0.3.0"
# claude_model = ""                # optional model override; empty = CLI default
# codex_model = ""                 # optional model override; empty = CLI default
# opencode_model = ""              # optional provider/model; empty = OpenCode default

# ── Production hosting ────────────────────────────────
# Productions (long-lived customer environments with their own domain and a
# dedicated production PostgreSQL cluster) are created at runtime via the
# create_production MCP tool or the dashboard's Production tab — not here.
# Production hosting is disabled by default. Uncomment the section header and
# enabled flag, then restart Oduflow. See https://docs.oduflow.dev/production/
# [production]
# enabled = true
# postgres_image = ""             # default: [database].image
# workers_cap = 8                 # upper bound for auto-tuned Odoo workers

# S3 backups for productions: continuous WAL archiving (WAL-G), scheduled
# snapshots (pg_dump + deduplicated filestore) and retention. Presence of
# the section (bucket + keys) configures backups; jobs run while production is enabled.
# [backup]
# bucket = ""
# access_key = ""
# secret_key = ""
# endpoint = ""                   # empty = AWS; set for MinIO/R2 (path-style implied)
# region = ""
# prefix = "oduflow"
# snapshot_time = "02:00"         # daily per-production snapshots (server-local time)
# basebackup_time = "03:30"       # daily WAL-G base backup
# keep = ["30:180", "7:30", "1:7"]  # snapshot retention: "interval_days:age_days"
# walg_keep_full = 7              # WAL-G base backups retained

# ── Teams ─────────────────────────────────────────────
# Each team gets isolated workspaces, templates, credentials and services.
# At least one [team.*] section is required.

[team.1]
hostname = "localhost"            # required and unique; OAuth issuer host for this team
                                   # port: http://{hostname}:{port}, traefik: https://{slug}.{hostname}
environment_slots = 20            # maximum concurrent environments; 0 = unlimited
environment_hostname_mode = "branch" # "branch": feature.dev.example.com; "slots": dev1.example.com..devN.example.com
service_slots = 10                # maximum managed auxiliary services; 0 = unlimited
auth_token = ""                   # MCP bearer token / OAuth client_secret (auto-generated on first run; HTTP refuses to start if empty)
ui_password = ""                  # Web UI password (auto-generated on first run; HTTP refuses to start if empty unless allow_insecure_http)
port_range = [50000, 50100]       # port range for Odoo containers
# db_quota_gb = 50                # combined size cap for the team's PostgreSQL DBs (environments + templates); 0 = off
# disk_quota_gb = 0               # cap on team files + databases via XFS project quotas (needs data dir on XFS with prjquota)
# public_scheme = ""              # per-team override of [routing] public_scheme ("http" | "https");
#                                  # empty = the global value. Lets one deployment serve a LAN team
#                                  # over http and a Cloudflare-tunnel team over https at once.
# agent_enabled = false           # per-team coding agent (dashboard Agent Chat / Agent CLI); off by default
#                                  # Agent UI is hidden for local_path live-mount environments.
# agent_default = "claude"        # "claude" | "codex" | "opencode" — default agent

# Variables injected into the team's agent container — provider credentials
# and anything custom. Uncomment together with agent_enabled above.
# [team.1.agent_env]
# CLAUDE_CODE_OAUTH_TOKEN = ""    # Claude subscription token (`claude setup-token`); outranks the API key
# ANTHROPIC_API_KEY = ""          # Claude API key (used when no OAuth token)
# OPENAI_API_KEY = ""             # Codex API key (recommended over subscription)
# OPENCODE_API_KEY = ""           # OpenCode Zen; other providers use their own variables
