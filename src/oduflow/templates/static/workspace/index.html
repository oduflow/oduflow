<script>
  // Resolve the theme before first paint, exactly like the dashboard
  // (DESIGN.md §2, Light theme): 'light' | 'dark' stored, absent = the OS.
  (function () {
    try {
      var stored = localStorage.getItem('oduflow-theme');
      var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
      var eff = mode === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : mode;
      document.documentElement.dataset.theme = eff;
    } catch (e) {}
  })();
</script>
