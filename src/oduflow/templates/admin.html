<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="/static/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/source-code-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="/static/icon.png" type="image/png" sizes="32x32">
<title>Oduflow — Server settings</title>
<script>
  // Same theme bootstrap as the dashboard (DESIGN.md §2): stored mode, else the OS.
  (function () {
    try {
      var stored = localStorage.getItem('oduflow-theme');
      var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
      var eff = mode === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : mode;
      document.documentElement.dataset.theme = eff;
    } catch (e) {}
  })();
</script>
<style>
  @font-face {
    font-family: "Source Sans 3";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("/static/source-sans-3-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Source Code Pro";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("/static/source-code-pro-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    /* "The Engineer's Console" tokens — kept identical to dashboard.html (see DESIGN.md) */
    --bg: oklch(0.07 0.01 260);
    --surface: oklch(0.1 0.01 260);
    --subtle: oklch(0.15 0.01 260);
    --border: oklch(0.3 0.013 260);
    --surface-raised: oklch(0.16 0.012 260);
    --border-raised: oklch(0.34 0.015 260);
    --text: oklch(0.93 0.005 260);
    --text-dim: oklch(0.7 0.01 260);
    --accent: oklch(0.6 0.2 260);
    --green: #34d399;
    --red: oklch(0.65 0.22 25);
    --yellow: #fbbf24;
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --rose: #fb7185;
    --terminal-bg: #060a12;
    --terminal-text: oklch(0.93 0.005 260);
    /* Diff colors live on the terminal field, which stays dark in both themes */
    --terminal-add: #34d399;
    --terminal-del: #fb7185;
    --terminal-hunk: #22d3ee;
    --accent-fg: #fff;
    --backdrop: rgba(0,0,0,0.72);
    --track: rgba(255,255,255,0.06);
    --track-border: rgba(255,255,255,0.08);
    --shadow-bar: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-menu: 0 16px 48px rgba(0,0,0,0.5);
    --shadow-modal: 0 24px 64px rgba(0,0,0,0.65);
    --font-sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Source Code Pro", ui-monospace, SFMono-Regular, Consolas, monospace;
    --text-2xs: 0.8125rem;
    --text-xs:  0.875rem;
    --text-sm:  0.9375rem;
    --text-md:  1rem;
    --text-lg:  1.0625rem;
    --text-xl:  1.4375rem;
    --radius: 0.625rem;
    --radius-sm: 0.425rem;
    --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent) 50%, transparent);
    --z-bar: 50;
    --z-dropdown: 100;
    --z-modal: 200;
    --z-toast: 300;
  }
  :root[data-theme="light"] {
    --bg: oklch(0.97 0.004 260);
    --surface: oklch(1 0 0);
    --subtle: oklch(0.96 0.005 260);
    --surface-raised: oklch(1 0 0);
    --border: oklch(0.9 0.006 260);
    --border-raised: oklch(0.86 0.008 260);
    --text: oklch(0.25 0.02 260);
    --text-dim: oklch(0.48 0.02 260);
    --accent: oklch(0.5 0.2 260);
    --green: oklch(0.47 0.13 160);
    --red: oklch(0.505 0.213 27.5);
    --yellow: oklch(0.5 0.14 62);
    --cyan: oklch(0.48 0.11 220);
    --violet: oklch(0.491 0.27 292.6);
    --rose: oklch(0.514 0.222 17);
    --accent-fg: #fff;
    --backdrop: rgba(15,23,42,0.45);
    --track: rgba(0,0,0,0.06);
    --track-border: rgba(0,0,0,0.1);
    --shadow-bar: 0 8px 24px rgba(15,23,42,0.1);
    --shadow-menu: 0 16px 48px rgba(15,23,42,0.14);
    --shadow-modal: 0 24px 64px rgba(15,23,42,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    font-size: var(--text-sm);
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    padding-bottom: 88px;
    min-height: 100vh;
  }
  :is(button, a, input, select, textarea, summary, [role="button"]):focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }
  code, .mono { font-family: var(--font-mono); font-size: var(--text-xs); }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .brand-lockup { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-lockup img { height: 28px; }
  :root[data-theme="light"] .brand-lockup img { filter: brightness(0); }
  .brand-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  header h1 { font-size: var(--text-xl); font-weight: 600; line-height: 1.05; }
  .brand-byline {
    color: var(--text-dim); font-size: var(--text-2xs); font-family: var(--font-mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .header-link {
    color: var(--text-dim); text-decoration: none; font-size: var(--text-sm); font-weight: 500;
    padding: 6px 8px; border-radius: var(--radius-sm); background: none; border: none;
    font-family: inherit; cursor: pointer;
  }
  .header-link:hover { color: var(--accent); }
  #theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: var(--text-xs); font-weight: 500;
  }
  #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #theme-toggle svg { width: 15px; height: 15px; display: block; }

  /* Banner: the gap between the file and the running process */
  .banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--yellow);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
    font-size: var(--text-sm);
  }
  .banner.error { border-left-color: var(--red); }
  .banner .banner-text { flex: 1 1 320px; min-width: 0; }
  .banner .banner-text code { overflow-wrap: anywhere; }
  .banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
  .side-nav {
    position: sticky; top: 16px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .side-nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: none; border: none; text-align: left;
    color: var(--text-dim); font-family: inherit; font-size: var(--text-md); font-weight: 500;
    padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer;
    border-left: 2px solid transparent;
  }
  .side-nav button:hover { color: var(--text); background: var(--subtle); }
  .side-nav button[aria-current="page"] { color: var(--accent); border-left-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .side-nav .nav-sep { height: 1px; background: var(--border); margin: 8px 4px; }
  .nav-count { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-dim); }
  .nav-dot { font-size: var(--text-2xs); font-weight: 600; color: var(--yellow); letter-spacing: 0.02em; }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 22px 20px;
  }
  .panel + .panel { margin-top: 16px; }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .panel-head h2 { font-size: var(--text-lg); font-weight: 600; }
  .panel-head .panel-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .panel-desc { color: var(--text-dim); font-size: var(--text-sm); line-height: 1.5; margin-bottom: 14px; max-width: 72ch; }
  .back-link { background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: var(--text-sm); cursor: pointer; padding: 0; margin-bottom: 10px; }
  .back-link:hover { color: var(--accent); }

  .field { padding: 12px 0; border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 6px 20px; }
  .field:first-of-type { border-top: none; }
  .field-label { display: flex; flex-direction: column; gap: 4px; }
  .field-label label { font-weight: 600; font-size: var(--text-sm); }
  .field-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .field-key { color: var(--text-dim); font-family: var(--font-mono); font-size: var(--text-2xs); }
  .field-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field-help { color: var(--text-dim); font-size: var(--text-xs); line-height: 1.45; }
  .field-note { color: var(--text-dim); font-size: var(--text-xs); line-height: 1.45; }
  .field-note::before { content: "Note: "; font-weight: 600; color: var(--text); }
  .field.edited .field-label label::after { content: " ·"; color: var(--accent); }
  .field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field-row > input, .field-row > select { flex: 1 1 220px; min-width: 0; }

  .text-input, select.text-input, textarea.text-input {
    width: 100%; padding: 7px 10px; font-size: var(--text-sm); font-family: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    min-height: 2.125rem;
  }
  .text-input.mono { font-family: var(--font-mono); font-size: var(--text-xs); }
  .text-input:focus { border-color: var(--accent); }
  .text-input::placeholder { color: var(--text-dim); opacity: 0.8; }
  .text-input[readonly] { color: var(--text-dim); }
  textarea.text-input { resize: vertical; line-height: 1.5; }
  input:disabled, select:disabled, textarea:disabled { opacity: 0.4; cursor: not-allowed; }
  .port-pair { display: flex; align-items: center; gap: 8px; }
  .port-pair input { width: 120px; flex: none; }
  .port-pair span { color: var(--text-dim); }
  .readonly-value { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text); padding: 7px 0; overflow-wrap: anywhere; }

  .btn {
    padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: inherit; font-size: var(--text-xs); font-weight: 500;
    cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; white-space: nowrap;
  }
  .btn-sm { padding: 3px 10px; }
  .btn:hover, .btn:focus-visible { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.danger:hover, .btn.danger:focus-visible { border-color: var(--red); color: var(--red); background: color-mix(in oklab, var(--red) 10%, transparent); }
  .btn.warn:hover, .btn.warn:focus-visible { border-color: var(--yellow); color: var(--yellow); background: color-mix(in oklab, var(--yellow) 10%, transparent); }
  .btn-create {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: var(--radius); cursor: pointer;
    font-family: inherit; font-size: var(--text-sm); font-weight: 600;
    transition: border-color 0.15s, color 0.15s, background 0.15s; white-space: nowrap;
  }
  .btn-create:hover, .btn-create:focus-visible { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .btn-create.danger { background: var(--red); border-color: var(--red); color: var(--accent-fg); }
  .btn-create.danger:hover, .btn-create.danger:focus-visible { opacity: 0.85; color: var(--accent-fg); background: var(--red); }
  .btn-create:disabled { opacity: 0.4; cursor: not-allowed; }

  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: var(--text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    background: color-mix(in oklab, var(--text-dim) 14%, transparent); color: var(--text-dim);
  }
  .badge-live { background: color-mix(in oklab, var(--green) 15%, transparent); color: var(--green); }
  .badge-restart, .badge-recreate { background: color-mix(in oklab, var(--yellow) 15%, transparent); color: var(--yellow); }
  .badge-locked { background: color-mix(in oklab, var(--text-dim) 14%, transparent); color: var(--text-dim); }
  .badge-new { background: color-mix(in oklab, var(--accent) 15%, transparent); color: var(--accent); }
  .badge-removed { background: color-mix(in oklab, var(--red) 15%, transparent); color: var(--red); }
  .badge-ok { background: color-mix(in oklab, var(--green) 15%, transparent); color: var(--green); }
  .badge-missing { background: color-mix(in oklab, var(--red) 15%, transparent); color: var(--red); }

  details.advanced { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  details.advanced > summary { cursor: pointer; color: var(--text-dim); font-weight: 600; font-size: var(--text-sm); padding: 4px 0; }
  details.advanced > summary:hover { color: var(--text); }

  table.grid { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table.grid th { text-align: left; font-weight: 600; font-size: var(--text-xs); color: var(--text-dim); padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid td.mono { font-family: var(--font-mono); font-size: var(--text-xs); overflow-wrap: anywhere; }
  table.grid td.actions { text-align: right; white-space: nowrap; }
  table.grid td.change-val { min-width: 11ch; }
  table.grid tr.removed td { opacity: 0.6; text-decoration: line-through; }
  table.grid tr.removed td.actions { opacity: 1; text-decoration: none; }
  .table-wrap { overflow-x: auto; }

  .env-rows { display: flex; flex-direction: column; gap: 6px; }
  .env-row { display: grid; grid-template-columns: minmax(140px, 240px) minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }

  .empty { color: var(--text-dim); font-size: var(--text-sm); padding: 18px 0; }
  .callout {
    background: color-mix(in oklab, var(--yellow) 8%, transparent);
    border: 1px solid color-mix(in oklab, var(--yellow) 25%, transparent);
    border-radius: var(--radius-sm); padding: 8px 12px; font-size: var(--text-sm); line-height: 1.5; margin-bottom: 10px;
  }
  .callout::before { content: "WARNING  "; font-weight: 600; font-size: var(--text-2xs); letter-spacing: 0.5px; color: var(--yellow); }
  .callout.error { background: color-mix(in oklab, var(--red) 8%, transparent); border-color: color-mix(in oklab, var(--red) 30%, transparent); color: var(--red); }
  .callout.error::before { content: "ERROR  "; color: var(--red); }

  pre.diff {
    background: var(--terminal-bg); color: var(--terminal-text); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.5;
    overflow: auto; max-height: 46vh; white-space: pre;
  }
  pre.diff .add { color: var(--terminal-add); }
  pre.diff .del { color: var(--terminal-del); }
  pre.diff .hunk { color: var(--terminal-hunk); }

  #raw-editor { min-height: 62vh; font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.5; tab-size: 2; white-space: pre; }

  /* Unsaved-draft bar */
  .save-bar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: var(--z-bar); display: flex; align-items: center; gap: 12px;
    background: var(--surface-raised); border: 1px solid var(--border-raised); border-radius: var(--radius);
    box-shadow: var(--shadow-bar); padding: 10px 14px; font-size: var(--text-sm);
  }
  .save-bar[hidden] { display: none; }

  .modal-overlay {
    position: fixed; inset: 0; background: var(--backdrop);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    z-index: var(--z-modal); display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface-raised); border: 1px solid var(--border-raised); border-radius: var(--radius);
    width: min(900px, calc(100vw - 32px)); max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: var(--shadow-modal);
  }
  .modal-sm { max-width: 480px; }
  .modal-md { max-width: 560px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: var(--text-lg); font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: var(--text-xl); cursor: pointer; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--border); }
  .modal-note { color: var(--text-dim); font-size: var(--text-sm); line-height: 1.5; margin-bottom: 14px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 4px; }
  .form-error { color: var(--red); font-size: var(--text-xs); margin-top: 8px; }
  .change-summary { margin-bottom: 12px; font-size: var(--text-sm); }
  .change-note { color: var(--text-dim); font-size: var(--text-xs); margin-top: 2px; }
  .gen-row { display: flex; gap: 8px; align-items: center; }
  .gen-row input { flex: 1; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface-raised);
    border: 1px solid var(--border-raised); border-radius: var(--radius); padding: 12px 20px;
    font-size: var(--text-sm); max-width: 440px; opacity: 0; transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: var(--z-toast);
  }
  .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .toast.error { border-color: var(--red); color: var(--red); }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border-raised);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    .spinner { animation: none; }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side-nav { position: static; flex-direction: row; flex-wrap: wrap; }
    .side-nav .nav-sep { display: none; }
    .field { grid-template-columns: 1fr; }
    .env-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand-lockup">
    <img src="/logo.png" alt="Oduflow logo">
    <div class="brand-copy">
      <h1>Server settings</h1>
      <div class="brand-byline" id="config-path" title="Config file">oduflow.toml · v__ODUFLOW_VERSION__</div>
    </div>
  </div>
  <div class="actions">
    <a class="header-link" href="/">Dashboard</a>
    <a class="header-link" href="https://docs.oduflow.dev/admin/" target="_blank" rel="noopener">Docs &#8599;</a>
    <button id="theme-toggle" type="button" onclick="cycleTheme()" aria-label="Theme"></button>
    <form method="post" action="/admin/logout"><button class="btn" type="submit">Sign out</button></form>
  </div>
</header>

<div id="banners"></div>

<div class="layout">
  <nav class="side-nav" id="side-nav" aria-label="Settings sections"></nav>
  <main id="panel" aria-live="polite"><div class="empty"><span class="spinner"></span> Loading…</div></main>
</div>

<div class="save-bar" id="save-bar" hidden role="region" aria-label="Unsaved changes">
  <span id="draft-count"></span>
  <button class="btn" type="button" onclick="discardDraft()">Discard</button>
  <button class="btn-create" type="button" id="review-btn" onclick="reviewDraft()">Review &amp; save</button>
</div>

<!-- Review: what changes, when it takes effect, the file diff -->
<div class="modal-overlay" id="review-modal" onclick="closeModal('review-modal', event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title">
    <div class="modal-header"><h2 id="review-title">Review changes</h2><button class="modal-close" aria-label="Close" onclick="closeModal('review-modal')">&times;</button></div>
    <div class="modal-body" id="review-body"></div>
    <div class="modal-footer">
      <button class="btn" type="button" onclick="closeModal('review-modal')">Cancel</button>
      <button class="btn-create" type="button" id="review-save" onclick="saveReviewed()">Save</button>
    </div>
  </div>
</div>

<!-- Generic confirm (with optional typed confirmation) -->
<div class="modal-overlay" id="confirm-modal" onclick="settleConfirm(false, event)">
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-header"><h2 id="confirm-title">Confirm</h2><button class="modal-close" aria-label="Close" onclick="settleConfirm(false)">&times;</button></div>
    <div class="modal-body">
      <p class="modal-note" id="confirm-message"></p>
      <div class="form-group" id="confirm-type-row" hidden>
        <label for="confirm-type" id="confirm-type-label"></label>
        <input class="text-input mono" id="confirm-type" autocomplete="off" oninput="syncConfirmType()">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" type="button" id="confirm-cancel" onclick="settleConfirm(false)">Cancel</button>
      <button class="btn-create" type="button" id="confirm-ok" onclick="settleConfirm(true)">Confirm</button>
    </div>
  </div>
</div>

<!-- Add team / add route -->
<div class="modal-overlay" id="add-modal" onclick="closeModal('add-modal', event)">
  <div class="modal modal-md" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal-header"><h2 id="add-title">Add</h2><button class="modal-close" aria-label="Close" onclick="closeModal('add-modal')">&times;</button></div>
    <div class="modal-body" id="add-body"></div>
    <div class="modal-footer">
      <button class="btn" type="button" onclick="closeModal('add-modal')">Cancel</button>
      <button class="btn-create" type="button" id="add-ok" onclick="submitAdd()">Add to changes</button>
    </div>
  </div>
</div>

<!-- History diff -->
<div class="modal-overlay" id="diff-modal" onclick="closeModal('diff-modal', event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="diff-title">
    <div class="modal-header"><h2 id="diff-title">Change</h2><button class="modal-close" aria-label="Close" onclick="closeModal('diff-modal')">&times;</button></div>
    <div class="modal-body" id="diff-body"></div>
    <div class="modal-footer"><button class="btn" type="button" onclick="closeModal('diff-modal')">Close</button></div>
  </div>
</div>

<!-- Restart progress -->
<div class="modal-overlay" id="restart-modal">
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="restart-title">
    <div class="modal-header"><h2 id="restart-title">Restarting Oduflow</h2></div>
    <div class="modal-body"><p class="modal-note" id="restart-status"><span class="spinner"></span> Waiting for the server to stop…</p></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// Server settings console. The forms are generated from the server's schema
// (oduflow/config_schema.py); every save goes through /admin/api/preview and
// /admin/api/apply, which validate with the same parser the server boots with.
const API = '/admin/api';
var STATE = null;           // /admin/api/state
var DRAFT = new Map();      // JSON(path) -> {path, value, unset}
var SECTION = 'server';     // current section id
var DETAIL = null;          // team id when a team is open
var REVEALED = {};          // JSON(path) -> revealed secret value
var OPEN_OPTIONAL = {};     // optional tables the admin chose to configure
var REVIEW = null;          // pending save request body
var RAW = { text: '', revision: '', loaded: false, dirty: false };

const SECTIONS = [
  { id: 'server', title: 'Server', groups: ['server'] },
  { id: 'routing', title: 'Routing', groups: ['routing'] },
  { id: 'routes', title: 'Extra routes', collection: 'routes' },
  { id: 'teams', title: 'Teams', collection: 'team' },
  { id: 'lifecycle', title: 'Lifecycle', groups: ['lifecycle'] },
  { id: 'agent', title: 'Coding agent', groups: ['agent', 'agent_opencode_provider'] },
  { id: 'production', title: 'Production', groups: ['production', 'production_wal'] },
  { id: 'backup', title: 'Backups', groups: ['backup'] },
  { id: 'storage', title: 'Storage', groups: ['storage'] },
  { id: 'database', title: 'Database', groups: ['database'] },
  { id: 'admin', title: 'Console access', groups: ['admin'] },
  { sep: true },
  { id: 'raw', title: 'Raw TOML' },
  { id: 'history', title: 'History' }
];

const APPLY_TEXT = { live: 'Live', restart: 'Restart', recreate: 'Recreate', locked: 'Read-only' };
const APPLY_TITLE = {
  live: 'Takes effect immediately after saving',
  restart: 'Saved now, takes effect after an Oduflow restart',
  recreate: 'Takes effect after a restart, and for existing environments/services only once they are recreated',
  locked: 'Shown read-only: changing it in the file alone breaks the deployment'
};

// ── utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pkey(path) { return JSON.stringify(path); }
function getIn(obj, path) {
  var node = obj;
  for (var i = 0; i < path.length; i++) {
    if (!node || typeof node !== 'object' || !(path[i] in node)) return undefined;
    node = node[path[i]];
  }
  return node;
}
function isSecretVal(v) { return v && typeof v === 'object' && v.$secret === true; }
function group(id) { return STATE.schema.find(function (g) { return g.id === id; }); }
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  clearTimeout(t._tid);
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  t._tid = setTimeout(function () { t.className = 'toast'; }, isError ? 8000 : 3500);
}
async function readResult(r) {
  var text = '';
  try { text = await r.text(); } catch (e) { text = ''; }
  try { return JSON.parse(text); }
  catch (e) {
    return { ok: false, error: 'HTTP ' + r.status + (text ? ': ' + text.trim().slice(0, 300) : '') };
  }
}
async function api(path, body) {
  var opts = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  };
  var r = await fetch(API + path, opts);
  if (r.status === 401) { window.location.href = '/admin/login'; return { ok: false, error: 'Signed out' }; }
  var data = await readResult(r);
  data._status = r.status;
  return data;
}
function randomSecret(bytes) {
  var a = new Uint8Array(bytes || 24);
  crypto.getRandomValues(a);
  return btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { showToast('Copied'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('Copied'); } catch (e) {}
    ta.remove();
  }
}

// ── modals ─────────────────────────────────────────────────────────────────
var _returnFocus = {};
function openModal(id) {
  var o = document.getElementById(id);
  if (!o.classList.contains('show')) _returnFocus[id] = document.activeElement;
  o.classList.add('show');
}
function closeModal(id, event) {
  if (event && event.target !== event.currentTarget) return;
  var o = document.getElementById(id);
  if (!o.classList.contains('show')) return;
  o.classList.remove('show');
  var prev = _returnFocus[id];
  delete _returnFocus[id];
  if (prev && document.contains(prev)) prev.focus();
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirm-modal').classList.contains('show')) { settleConfirm(false); return; }
  ['add-modal', 'diff-modal', 'review-modal'].forEach(function (id) {
    if (document.getElementById(id).classList.contains('show')) closeModal(id);
  });
});
var _confirm = null;
function confirmDialog(opts) {
  return new Promise(function (resolve) {
    _confirm = { resolve: resolve, opts: opts };
    document.getElementById('confirm-title').textContent = opts.title || 'Confirm';
    document.getElementById('confirm-message').textContent = opts.message || '';
    var ok = document.getElementById('confirm-ok');
    ok.textContent = opts.confirmLabel || 'Confirm';
    ok.classList.toggle('danger', !!opts.danger);
    var row = document.getElementById('confirm-type-row');
    row.hidden = !opts.typed;
    var input = document.getElementById('confirm-type');
    input.value = '';
    if (opts.typed) {
      document.getElementById('confirm-type-label').textContent = 'Type ' + opts.typed + ' to confirm';
    }
    ok.disabled = !!opts.typed;
    openModal('confirm-modal');
    (opts.typed ? input : (opts.danger ? document.getElementById('confirm-cancel') : ok)).focus();
  });
}
function syncConfirmType() {
  if (!_confirm || !_confirm.opts.typed) return;
  document.getElementById('confirm-ok').disabled =
    document.getElementById('confirm-type').value.trim() !== _confirm.opts.typed;
}
function settleConfirm(value, event) {
  if (event && event.target !== event.currentTarget) return;
  if (!_confirm) return;
  var c = _confirm; _confirm = null;
  closeModal('confirm-modal');
  c.resolve(value);
}

// ── state ──────────────────────────────────────────────────────────────────
async function loadState() {
  var data;
  try { data = await api('/state'); }
  catch (e) { showToast('Connection error: ' + e.message, true); return false; }
  if (!data.ok) { showToast(data.error || 'Cannot load the config', true); return false; }
  STATE = data;
  document.getElementById('config-path').textContent = data.path + ' · v__ODUFLOW_VERSION__';
  renderBanners();
  renderNav();
  renderSection();
  return true;
}

function fileValue(path) { return STATE && STATE.values ? getIn(STATE.values, path) : undefined; }
function currentValue(path) {
  var d = DRAFT.get(pkey(path));
  if (d) return d.unset ? undefined : d.value;
  return fileValue(path);
}

// ── draft ──────────────────────────────────────────────────────────────────
function sameValue(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }
function draftPut(path, value, unset) {
  var key = pkey(path);
  var prefix = key.slice(0, -1) + ',';
  // A table removal supersedes edits below it, and an edit below a pending
  // removal cancels that removal (the table stays).
  if (unset) {
    Array.from(DRAFT.keys()).forEach(function (k) { if (k.indexOf(prefix) === 0) DRAFT.delete(k); });
  } else {
    for (var i = path.length - 1; i > 0; i--) {
      var parent = pkey(path.slice(0, i));
      var d = DRAFT.get(parent);
      if (d && d.unset) DRAFT.delete(parent);
    }
  }
  var file = fileValue(path);
  if (unset ? file === undefined : (!isSecretVal(file) && sameValue(file, value))) DRAFT.delete(key);
  else DRAFT.set(key, unset ? { path: path, unset: true } : { path: path, value: value });
  updateSaveBar();
}
function draftDrop(path) { DRAFT.delete(pkey(path)); updateSaveBar(); }
function updateSaveBar() {
  var bar = document.getElementById('save-bar');
  bar.hidden = DRAFT.size === 0;
  document.getElementById('draft-count').textContent =
    DRAFT.size + (DRAFT.size === 1 ? ' unsaved change' : ' unsaved changes');
  renderNav();
}
async function discardDraft() {
  if (DRAFT.size && !(await confirmDialog({ title: 'Discard changes', message: 'Drop ' + DRAFT.size + ' unsaved change(s)?', confirmLabel: 'Discard', danger: true }))) return;
  DRAFT.clear(); OPEN_OPTIONAL = {};
  updateSaveBar(); renderSection();
}
window.addEventListener('beforeunload', function (e) {
  if (DRAFT.size || RAW.dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ── banners ────────────────────────────────────────────────────────────────
function renderBanners() {
  var html = '';
  if (STATE.file_error) {
    html += '<div class="banner error" role="alert"><span class="badge badge-missing">Invalid file</span>' +
      '<span class="banner-text">The config file on disk does not load: <code>' + esc(STATE.file_error) +
      '</code>. The running server keeps its last good config. Fix it in Raw TOML.</span>' +
      '<span class="banner-actions"><button class="btn" onclick="go(\'raw\')">Open Raw TOML</button></span></div>';
  }
  var pending = STATE.pending || [];
  if (pending.length) {
    var live = pending.filter(function (c) { return c.apply === 'live'; });
    var rest = pending.filter(function (c) { return c.apply !== 'live'; });
    var names = pending.slice(0, 4).map(function (c) { return '<code>' + esc(c.path.join('.')) + '</code>'; }).join(', ') +
      (pending.length > 4 ? ', …' : '');
    var label = rest.length ? 'Restart pending' : 'Not applied';
    html += '<div class="banner"><span class="badge badge-restart">' + label + '</span>' +
      '<span class="banner-text">' + pending.length + ' saved change' + (pending.length === 1 ? ' is' : 's are') +
      ' not active in the running server yet: ' + names + '</span><span class="banner-actions">' +
      '<button class="btn" onclick="showPending()">Details</button>' +
      (live.length && !rest.length ? '<button class="btn" onclick="reloadLive()">Apply now</button>' : '') +
      (rest.length && STATE.restart_available ? '<button class="btn warn" onclick="restartServer()">Restart Oduflow</button>' : '') +
      '</span></div>';
  }
  document.getElementById('banners').innerHTML = html;
}
function changeTable(changes) {
  if (!changes.length) return '<p class="empty">No effective change.</p>';
  return '<div class="table-wrap"><table class="grid"><thead><tr><th>Setting</th><th>Before</th><th>After</th><th>Takes effect</th></tr></thead><tbody>' +
    changes.map(function (c) {
      return '<tr><td><span class="mono">' + esc(c.label) + '</span>' +
        (c.note ? '<div class="change-note">' + esc(c.note) + '</div>' : '') + '</td>' +
        '<td class="mono change-val">' + esc(c.old) + '</td><td class="mono change-val">' + esc(c.new) + '</td>' +
        '<td>' + applyBadge(c.apply) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function showPending() {
  document.getElementById('diff-title').textContent = 'Saved, not active yet';
  document.getElementById('diff-body').innerHTML =
    '<p class="modal-note">The file on disk differs from what the running server uses. Live values apply with “Apply now”; the rest needs a restart.</p>' +
    changeTable(STATE.pending);
  openModal('diff-modal');
}
async function reloadLive() {
  var data = await api('/reload', {});
  if (!data.ok) { showToast(data.error || 'Reload failed', true); return; }
  showToast(data.problem || (data.applied.length + ' live change(s) applied'), !!data.problem);
  loadState();
}

// ── navigation ─────────────────────────────────────────────────────────────
function draftCountUnder(prefixes) {
  var n = 0;
  DRAFT.forEach(function (d) { if (prefixes.indexOf(d.path[0]) !== -1) n++; });
  return n;
}
function sectionTables(sec) {
  if (sec.collection === 'team') return ['team'];
  if (sec.collection === 'routes') return ['route'];
  return (sec.groups || []).map(function (g) { var gr = group(g); return gr ? gr.table[0] : g; });
}
function renderNav() {
  if (!STATE) return;
  var nav = document.getElementById('side-nav');
  nav.innerHTML = SECTIONS.map(function (sec) {
    if (sec.sep) return '<div class="nav-sep" role="separator"></div>';
    var extra = '';
    if (sec.collection === 'team') extra = '<span class="nav-count">' + Object.keys(fileValue(['team']) || {}).length + '</span>';
    var edits = sec.id === 'raw' || sec.id === 'history' ? 0 : draftCountUnder(sectionTables(sec));
    if (edits) extra = '<span class="nav-dot">' + edits + ' edited</span>';
    if (sec.id === 'history' && STATE.history) extra = '<span class="nav-count">' + STATE.history + '</span>';
    return '<button type="button" onclick="go(\'' + sec.id + '\')"' + (SECTION === sec.id ? ' aria-current="page"' : '') +
      '><span>' + esc(sec.title) + '</span>' + extra + '</button>';
  }).join('');
}
function go(id, detail) {
  SECTION = id; DETAIL = detail || null;
  renderNav(); renderSection();
  window.scrollTo(0, 0);
}

// ── field rendering ────────────────────────────────────────────────────────
function applyBadge(apply) {
  return '<span class="badge badge-' + esc(apply) + '" title="' + esc(APPLY_TITLE[apply] || '') + '">' + esc(APPLY_TEXT[apply] || apply) + '</span>';
}
function fieldId(path) { return 'f-' + path.join('--').replace(/[^A-Za-z0-9_-]/g, '_'); }
function defaultText(f) {
  if (f.default === null || f.default === undefined || f.default === '') return '';
  if (typeof f.default === 'boolean') return f.default ? 'on' : 'off';
  if (Array.isArray(f.default)) return f.kind === 'port_range' ? f.default.join('–') : f.default.join(', ');
  if (typeof f.default === 'object') return '';
  return String(f.default);
}
function renderField(f, path, opts) {
  opts = opts || {};
  var id = fieldId(path);
  var edited = DRAFT.has(pkey(path));
  var val = currentValue(path);
  var control = '';
  var locked = f.apply === 'locked';
  if (locked) {
    if (f.kind === 'secret') control = secretControl(f, path, val, true);
    else control = '<div class="readonly-value">' + esc(val === undefined ? (defaultText(f) ? defaultText(f) + ' (default)' : '(not set)') : val) + '</div>';
  } else if (f.kind === 'str') {
    var ph = f.placeholder || (defaultText(f) ? 'Default: ' + defaultText(f) : '');
    control = '<input class="text-input mono" id="' + id + '" value="' + esc(val === undefined ? '' : val) + '" placeholder="' + esc(ph) + '" ' +
      'spellcheck="false" autocomplete="off" onchange="onText(this, ' + esc(JSON.stringify(path)) + ')">';
  } else if (f.kind === 'int' || f.kind === 'float') {
    control = '<input class="text-input mono" type="number" id="' + id + '"' + (f.kind === 'float' ? ' step="any"' : ' step="1"') +
      (f.minimum !== undefined ? ' min="' + f.minimum + '"' : '') +
      ' value="' + esc(val === undefined ? '' : val) + '" placeholder="' + esc(defaultText(f) ? 'Default: ' + defaultText(f) : '') + '"' +
      ' onchange="onNumber(this, ' + esc(JSON.stringify(path)) + ', ' + (f.kind === 'float') + ')">';
  } else if (f.kind === 'bool') {
    var sel = val === undefined ? '' : (val ? 'true' : 'false');
    control = '<select class="text-input" id="' + id + '" onchange="onBool(this, ' + esc(JSON.stringify(path)) + ')">' +
      '<option value=""' + (sel === '' ? ' selected' : '') + '>Default (' + (f.default ? 'on' : 'off') + ')</option>' +
      '<option value="true"' + (sel === 'true' ? ' selected' : '') + '>On</option>' +
      '<option value="false"' + (sel === 'false' ? ' selected' : '') + '>Off</option></select>';
  } else if (f.kind === 'enum' || f.kind === 'tls') {
    var cur = val === undefined ? '' : (f.kind === 'tls' ? tlsText(val) : String(val));
    var choices = f.choices.slice();
    var opts2 = '';
    var hasEmpty = choices.indexOf('') !== -1;
    if (!hasEmpty) opts2 += '<option value=""' + (cur === '' ? ' selected' : '') + '>Default (' + esc(f.default) + ')</option>';
    choices.forEach(function (c) {
      var label = c === '' ? (f.default === '' ? 'Not set (derived)' : 'Default') : (f.kind === 'tls' ? TLS_LABELS[c] : c);
      opts2 += '<option value="' + esc(c) + '"' + (cur === c ? ' selected' : '') + '>' + esc(label) + '</option>';
    });
    control = '<select class="text-input mono" id="' + id + '" onchange="onEnum(this, ' + esc(JSON.stringify(path)) + ')">' + opts2 + '</select>';
  } else if (f.kind === 'secret') {
    control = secretControl(f, path, val, false);
  } else if (f.kind === 'port_range') {
    var pr = Array.isArray(val) ? val : ['', ''];
    control = '<div class="port-pair"><input class="text-input mono" type="number" id="' + id + '" aria-label="Start port" value="' + esc(pr[0]) + '" placeholder="' + esc((f.default || [])[0]) + '" onchange="onPorts(\'' + id + '\', ' + esc(JSON.stringify(path)) + ')">' +
      '<span>to</span><input class="text-input mono" type="number" id="' + id + '-end" aria-label="End port" value="' + esc(pr[1]) + '" placeholder="' + esc((f.default || [])[1]) + '" onchange="onPorts(\'' + id + '\', ' + esc(JSON.stringify(path)) + ')"></div>';
  } else if (f.kind === 'str_list') {
    var list = Array.isArray(val) ? val : [];
    control = '<textarea class="text-input mono" rows="3" id="' + id + '" placeholder="' + esc((f.default || []).join('\n')) + '" onchange="onList(this, ' + esc(JSON.stringify(path)) + ')">' + esc(list.join('\n')) + '</textarea>';
  } else if (f.kind === 'env_map') {
    control = envMapControl(f, path, val);
  }
  return '<div class="field' + (edited ? ' edited' : '') + '">' +
    '<div class="field-label"><label for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="field-key">required</span>' : '') + '</label>' +
    '<div class="field-meta"><span class="field-key">' + esc(f.key) + '</span>' + applyBadge(f.apply) + '</div></div>' +
    '<div class="field-body">' + control +
    (f.help ? '<div class="field-help">' + esc(f.help) + '</div>' : '') +
    (f.note ? '<div class="field-note">' + esc(f.note) + '</div>' : '') + '</div></div>';
}
const TLS_LABELS = { 'true': 'true — Let’s Encrypt on every route', '{}': '{} — Traefik default certificate', 'false': 'false — plain HTTP, upstream terminates TLS' };
function tlsText(v) { return v === true ? 'true' : v === false ? 'false' : (v && typeof v === 'object' ? '{}' : String(v)); }

function secretControl(f, path, val, locked) {
  var id = fieldId(path);
  var key = pkey(path);
  var drafted = DRAFT.get(key);
  var stored = fileValue(path);
  var isSet = isSecretVal(stored) && stored.set;
  var revealed = REVEALED[key];
  var shown = drafted && !drafted.unset ? drafted.value : (revealed !== undefined ? revealed : '');
  var ph = drafted && drafted.unset ? 'Will be removed'
    : isSet ? (locked ? 'Stored' : 'Stored — leave empty to keep') : 'Not set';
  var html = '<div class="field-row"><input class="text-input mono" id="' + id + '" type="' + (revealed !== undefined || (drafted && !drafted.unset) ? 'text' : 'password') + '" ' +
    'autocomplete="new-password" spellcheck="false" value="' + esc(shown) + '" placeholder="' + esc(ph) + '"' +
    (locked ? ' readonly' : ' onchange="onSecret(this, ' + esc(JSON.stringify(path)) + ')"') + '>';
  if (isSet && revealed === undefined) html += '<button class="btn btn-sm" type="button" onclick="revealSecret(' + esc(JSON.stringify(path)) + ')">Reveal</button>';
  if (shown) html += '<button class="btn btn-sm" type="button" onclick="copyField(\'' + id + '\')">Copy</button>';
  if (!locked) {
    html += '<button class="btn btn-sm" type="button" onclick="generateSecret(' + esc(JSON.stringify(path)) + ', ' + (f.key === 'production_token' ? 32 : 24) + ')">Generate</button>';
    if (isSet && !f.required && !(drafted && drafted.unset)) html += '<button class="btn btn-sm danger" type="button" onclick="removeKey(' + esc(JSON.stringify(path)) + ')">Remove</button>';

// ── field handlers ─────────────────────────────────────────────────────────
function onText(el, path) {
  var v = el.value.trim();

  markEdited(el, path);
}
function onNumber(el, path, isFloat) {
  var v = el.value.trim();
  if (v === '') { draftPut(path, null, true); markEdited(el, path); return; }
  var n = isFloat ? parseFloat(v) : parseInt(v, 10);
  if (isNaN(n)) { showToast('Enter a number', true); return; }
  draftPut(path, n, false); markEdited(el, path);
}
function onBool(el, path) {
  if (el.value === '') draftPut(path, null, true); else draftPut(path, el.value === 'true', false);
  markEdited(el, path);
}
function onEnum(el, path) {
  // An empty choice removes the key, so the parser's default applies.
  var f = fieldFor(path);
  if (el.value === '') draftPut(path, null, true);
  else draftPut(path, f && f.kind === 'tls' ? tlsValue(el.value) : el.value, false);
  markEdited(el, path);
}
function tlsValue(s) { return s === 'true' ? true : s === 'false' ? false : {}; }
function onPorts(id, path) {
  var a = document.getElementById(id).value.trim(), b = document.getElementById(id + '-end').value.trim();
  if (a === '' && b === '') { draftPut(path, null, true); }
  else if (a === '' || b === '') { return; }

}
function onList(el, path) {
  var items = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!items.length) draftPut(path, null, true); else draftPut(path, items, false);
  markEdited(el, path);
}
function onSecret(el, path) {
  var v = el.value.trim();

  if (v === '' || (REVEALED[key] !== undefined && v === REVEALED[key])) {
    draftDrop(path);

    DRAFT.set(key, { path: path, value: v });
    updateSaveBar();

}
function markEdited(el, path) {

  if (field) field.classList.toggle('edited', DRAFT.has(pkey(path)));
}
function removeKey(path) { draftPut(path, null, true); renderSection(); }
function undoKey(path) { draftDrop(path); renderSection(); }
function copyField(id) { copyText(document.getElementById(id).value); }
async function revealSecret(path) {
  var data = await api('/reveal', { path: path });
  if (!data.ok) { showToast(data.error || 'Cannot reveal', true); return; }
  REVEALED[pkey(path)] = data.value;
  renderSection();
}
function generateSecret(path, bytes) {
  DRAFT.set(pkey(path), { path: path, value: randomSecret(bytes) });
  updateSaveBar(); renderSection();

}
function fieldFor(path) {
  for (var i = 0; i < STATE.schema.length; i++) {
    var g = STATE.schema[i];
    if (g.table.length !== path.length - 1) continue;
    var ok = g.table.every(function (p, j) { return p === '*' || p === path[j]; });
    if (!ok) continue;

// env_map: the rows of one variable list, in document order. Row buttons

function envRows(path) {

// Collect rows into {NAME: value | {keep: true}}, optionally skipping one row

function collectEnv(path, skip) {
  var out = {};

  envRows(path).forEach(function (row) {
    if (row === skip) return;
    var inputs = row.querySelectorAll('input');
    var name = inputs[0].value.trim();
    if (!name) return;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) bad = name;
    var v = inputs[1].value;
    out[name] = (inputs[1].dataset.keep && v === '') ? { keep: true } : v;
  });
  if (bad) { showToast('Invalid variable name: ' + bad, true); return null; }
  return out;
}
function applyEnv(path, v) {
  var stored = fileValue(path) || {};
  var unchanged = Object.keys(v).length === Object.keys(stored).length && Object.keys(v).every(function (k) {
    return k in stored && v[k] && v[k].keep === true;
  });
  if (unchanged) draftDrop(path);

function onEnvEdit(path) {

}
function addEnvRow(path) {
  var v = collectEnv(path);

  var n = 1, name = 'NEW_VARIABLE';
  while (name in v) name = 'NEW_VARIABLE_' + (++n);

}
function removeEnvRow(path, index) {

async function revealEnv(path, index) {
  var row = envRows(path)[index];

  var data = await api('/reveal', { path: path.concat([row.dataset.name]) });
  if (!data.ok) { showToast(data.error || 'Cannot reveal', true); return; }
  var input = row.querySelectorAll('input')[1];
  input.type = 'text'; input.value = data.value; input.dataset.keep = '';
  input.dataset.revealed = data.value;
}

// ── sections ───────────────────────────────────────────────────────────────
function renderSection() {
  if (!STATE) return;
  var main = document.getElementById('panel');
  var sec = SECTIONS.find(function (s) { return s.id === SECTION; }) || SECTIONS[0];
  if (sec.id === 'raw') { renderRaw(main); return; }
  if (sec.id === 'history') { renderHistory(main); return; }
  if (STATE.file_error && !STATE.values) { main.innerHTML = '<div class="panel"><p class="empty">Fix the file in Raw TOML first.</p></div>'; return; }
  if (sec.collection === 'team') { DETAIL ? renderTeam(main, DETAIL) : renderTeams(main); return; }
  if (sec.collection === 'routes') { renderRoutes(main); return; }
  main.innerHTML = sec.groups.map(function (gid) { return groupPanel(group(gid), []); }).join('');
}
function groupPanel(g, prefix, opts) {
  opts = opts || {};
  var tablePath = prefix.length ? prefix : g.table.slice();
  var exists = fileValue(tablePath) !== undefined;
  var removing = DRAFT.has(pkey(tablePath)) && DRAFT.get(pkey(tablePath)).unset;
  var openKey = pkey(tablePath);
  var head = '<div class="panel-head"><h2>' + esc(opts.title || g.title) + '</h2><div class="panel-actions">';
  if (g.optional && exists && !removing) head += '<button class="btn danger" type="button" onclick="removeTable(' + esc(JSON.stringify(tablePath)) + ', ' + esc(JSON.stringify(g.title)) + ')">Disable</button>';
  if (removing) head += '<span class="badge badge-removed">Will be removed</span><button class="btn" type="button" onclick="undoKey(' + esc(JSON.stringify(tablePath)) + ')">Undo</button>';
  head += '</div></div>';
  var body = '';
  if (g.description) body += '<p class="panel-desc">' + esc(g.description) + '</p>';
  if (g.optional && (!exists || removing) && !OPEN_OPTIONAL[openKey]) {
    if (!removing) {
      body += '<p class="empty">Not configured.</p><button class="btn-create" type="button" onclick="openOptional(' + esc(JSON.stringify(tablePath)) + ')">Configure ' + esc(g.title.toLowerCase()) + '</button>' +
        (g.presence_note ? '<p class="field-help" style="margin-top:8px">' + esc(g.presence_note) + '</p>' : '');
    }
    return '<section class="panel">' + head + body + '</section>';
  }
  var basic = g.fields.filter(function (f) { return !f.advanced; });
  var adv = g.fields.filter(function (f) { return f.advanced; });
  body += basic.map(function (f) { return renderField(f, tablePath.concat([f.key])); }).join('');
  if (adv.length) {
    body += '<details class="advanced"><summary>Advanced</summary>' +
      adv.map(function (f) { return renderField(f, tablePath.concat([f.key])); }).join('') + '</details>';
  }
  return '<section class="panel">' + head + body + '</section>';
}
function openOptional(path) { OPEN_OPTIONAL[pkey(path)] = true; renderSection(); }
async function removeTable(path, title) {
  if (!(await confirmDialog({ title: 'Disable ' + title.toLowerCase(), message: 'Remove the whole [' + path.join('.') + '] section from oduflow.toml? You review the change before it is saved.', confirmLabel: 'Disable', danger: true }))) return;
  draftPut(path, null, true);
  delete OPEN_OPTIONAL[pkey(path)];
  renderSection();
}

  main.innerHTML = '<section class="panel"><div class="panel-head"><h2>History</h2></div><p class="empty"><span class="spinner"></span> Loading…</p></section>';
  var data = await api('/history');
  if (!data.ok) { showToast(data.error || 'Cannot load history', true); return; }
  var rows = data.entries.map(function (e) {
    var when = new Date(e.ts * 1000);
    var paths = (e.paths || []).slice(0, 4).join(', ') + ((e.paths || []).length > 4 ? ', …' : '');
    return '<tr><td class="mono" title="' + esc(when.toISOString()) + '">' + esc(when.toLocaleString()) + '</td>' +
      '<td>' + esc(e.note) + '<div class="change-note mono">' + esc(paths) + '</div></td>' +
      '<td class="mono">' + esc(e.actor || '') + '</td>' +
      '<td class="actions"><button class="btn btn-sm" type="button" onclick="showHistory(' + esc(JSON.stringify(e.id)) + ')">Diff</button> ' +
      '<button class="btn btn-sm warn" type="button" onclick="revertHistory(' + esc(JSON.stringify(e.id)) + ')">Revert</button></td></tr>';
  }).join('');
  main.innerHTML = '<section class="panel"><div class="panel-head"><h2>History</h2></div>' +
    '<p class="panel-desc">Every save through this console, newest first. Revert restores the file as it was before that save (after review). Kept next to the config, owner-only.</p>' +
    (rows ? '<div class="table-wrap"><table class="grid"><thead><tr><th>When</th><th>Change</th><th>By</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<p class="empty">No saves yet.</p>') + '</section>';
}
async function showHistory(id) {
  var data = await api('/history/' + encodeURIComponent(id));
  if (!data.ok) { showToast(data.error || 'Cannot load the change', true); return; }
  document.getElementById('diff-title').textContent = data.entry.note;
  document.getElementById('diff-body').innerHTML = diffHtml(data.diff);
  openModal('diff-modal');
}
function revertHistory(id) { startReview({ restore: id, revision: STATE.revision }, 'restore'); }

// ── review & save ──────────────────────────────────────────────────────────
function diffHtml(diff) {
  if (!diff) return '<p class="empty">The file text does not change.</p>';
  return '<pre class="diff">' + diff.split('\n').map(function (line) {
    var cls = line.indexOf('@@') === 0 ? 'hunk' : (line[0] === '+' && line.indexOf('+++') !== 0) ? 'add' : (line[0] === '-' && line.indexOf('---') !== 0) ? 'del' : '';
    return cls ? '<span class="' + cls + '">' + esc(line) + '</span>' : esc(line);
  }).join('\n') + '</pre>';
}
function reviewDraft() {
  var changes = Array.from(DRAFT.values()).map(function (d) {
    return d.unset ? { path: d.path, unset: true } : { path: d.path, value: d.value };
  });
  startReview({ changes: changes, revision: STATE.revision }, 'form');
}
async function startReview(body, source) {
  var btn = document.getElementById('review-save');
  document.getElementById('review-body').innerHTML = '<p class="empty"><span class="spinner"></span> Validating…</p>';
  btn.disabled = true;
  openModal('review-modal');
  var data = await api('/preview', body);
  REVIEW = { body: body, source: source, data: data };
  var html = '';
  if (!data.ok) {
    html += '<div class="callout error">' + esc(data.error || 'Invalid') + '</div>';
    if (data._status === 409) html += '<p class="modal-note">Reload the page to see the current file.</p>';
  } else {
    var worst = data.apply;
    var summary = worst === 'live' ? 'Everything applies as soon as you save.'
      : worst === 'restart' ? 'Some changes apply only after an Oduflow restart; live ones apply at once.'
      : worst === 'recreate' ? 'Some changes need a restart and then recreating existing environments/services.'
      : 'Some changes need manual steps outside Oduflow — read the notes.';
    html += '<p class="change-summary">' + applyBadge(worst) + ' ' + esc(summary) + '</p>';
    (data.warnings || []).forEach(function (w) { html += '<div class="callout">' + esc(w) + '</div>'; });
    if (data.signs_out) html += '<div class="callout">The console password changes: you will be signed out and must sign in with the new one.</div>';
    html += changeTable(data.changes);
  }
  if (data.diff) html += '<details style="margin-top:12px"' + (data.ok ? '' : ' open') + '><summary class="field-help" style="cursor:pointer">File diff (secrets masked)</summary>' + diffHtml(data.diff) + '</details>';
  document.getElementById('review-body').innerHTML = html;
  btn.disabled = !data.ok || !data.changes || !data.changes.length;
  btn.textContent = 'Save';
}
async function saveReviewed() {
  if (!REVIEW || !REVIEW.data.ok) return;
  var btn = document.getElementById('review-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  var data = await api('/apply', REVIEW.body);
  btn.textContent = 'Save';
  if (!data.ok) {
    btn.disabled = false;
    document.getElementById('review-body').insertAdjacentHTML('afterbegin', '<div class="callout error">' + esc(data.error || 'Save failed') + '</div>');
    return;
  }
  var signsOut = REVIEW.data.signs_out;
  var source = REVIEW.source;
  closeModal('review-modal');
  REVIEW = null;
  if (source === 'form') { DRAFT.clear(); OPEN_OPTIONAL = {}; REVEALED = {}; }
  if (source === 'raw') RAW.dirty = false;
  RAW.loaded = false;
  updateSaveBar();
  var msg = 'Saved.';
  if (data.applied.length) msg += ' ' + data.applied.length + ' change(s) live now.';
  var waiting = data.pending.filter(function (c) { return c.apply !== 'live'; }).length;
  if (waiting) msg += ' ' + waiting + ' wait(s) for a restart.';
  if (data.problem) msg += ' ' + data.problem;
  showToast(msg, !!data.problem);
  if (signsOut) { setTimeout(function () { window.location.href = '/admin/login'; }, 1200); return; }
  await loadState();
}

// ── restart ────────────────────────────────────────────────────────────────
// In port mode the console is reached on [server] port directly; a pending
// port change moves it. Behind Traefik the public URL stays the same.
function movedConsoleUrl() {
  var mode = fileValue(['routing', 'mode']);
  if (mode === 'traefik') return '';
  var change = (STATE.pending || []).find(function (c) { return c.path.join('.') === 'server.port'; });
  if (!change) return '';
  var port = fileValue(['server', 'port']) || 8000;
  if (String(port) === window.location.port || (!window.location.port && String(port) === '80')) return '';
  return window.location.protocol + '//' + window.location.hostname + ':' + port + '/admin';
}
async function restartServer() {
  if (DRAFT.size) { showToast('Save or discard your unsaved changes first', true); return; }
  var target = movedConsoleUrl();
  if (!(await confirmDialog({
    title: 'Restart Oduflow',
    message: 'The server stops serving for a few seconds and starts again with the saved config: dashboards, MCP clients and this console reconnect. Environments, services and productions keep running.' +
      (target ? ' The port changes: afterwards the console is at ' + target + '.' : ''),
    confirmLabel: 'Restart'
  }))) return;
  var before = STATE.boot_id;
  var moved = movedConsoleUrl();
  var data = await api('/restart', {});
  if (!data.ok) {
    var detail = data.busy && data.busy.length ? ' Running: ' + data.busy.join('; ') : '';
    showToast((data.error || 'Restart refused') + detail, true);
    return;
  }
  openModal('restart-modal');
  var status = document.getElementById('restart-status');
  if (moved) {
    // A new listener port: this origin will not answer again, so hand over
    // the new address instead of polling one that stays dark.
    status.innerHTML = 'Oduflow restarts on a new port. Open the console at <a href="' + esc(moved) +
      '">' + esc(moved) + '</a> in a few seconds.';
    return;
  }
  var started = Date.now();
  var timer = setInterval(async function () {
    var secs = Math.round((Date.now() - started) / 1000);
    if (secs > 180) {
      clearInterval(timer);
      status.textContent = 'The server has not come back after 3 minutes. Check its log (journalctl -u oduflow or docker logs).';
      return;
    }
    try {
      var r = await fetch(API + '/state');
      if (r.status === 401) { clearInterval(timer); window.location.href = '/admin/login'; return; }
      var d = await r.json();
      if (d.ok && d.boot_id && d.boot_id !== before) {
        clearInterval(timer);
        closeModal('restart-modal');
        showToast('Oduflow restarted with the saved config');
        loadState();
        return;
      }
      status.innerHTML = '<span class="spinner"></span> Waiting for the server to stop… ' + secs + 's';
    } catch (e) {
      status.innerHTML = '<span class="spinner"></span> Starting up… ' + secs + 's';
    }
  }, 1000);
}

// ── theme toggle (same behaviour as the dashboard) ─────────────────────────
var THEME_ICONS = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
};
var THEME_LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
var _prefersLight = window.matchMedia('(prefers-color-scheme: light)');
function getThemeMode() { var s = localStorage.getItem('oduflow-theme'); return (s === 'light' || s === 'dark') ? s : 'system'; }
function resolveTheme(mode) { return (mode === 'light' || mode === 'dark') ? mode : (_prefersLight.matches ? 'light' : 'dark'); }
function updateThemeToggle(mode) {
  var btn = document.getElementById('theme-toggle');
  btn.innerHTML = THEME_ICONS[mode] + '<span>' + THEME_LABELS[mode] + '</span>';
  btn.title = 'Theme: ' + THEME_LABELS[mode] + ' (click to cycle)';
  btn.setAttribute('aria-label', 'Theme: ' + THEME_LABELS[mode] + '. Click to change.');
}
function cycleTheme() {
  var order = ['system', 'light', 'dark'];
  var mode = order[(order.indexOf(getThemeMode()) + 1) % order.length];
  if (mode === 'system') localStorage.removeItem('oduflow-theme'); else localStorage.setItem('oduflow-theme', mode);
  document.documentElement.dataset.theme = resolveTheme(mode);
  updateThemeToggle(mode);
}
_prefersLight.addEventListener('change', function () {
  if (getThemeMode() === 'system') document.documentElement.dataset.theme = resolveTheme('system');
});
updateThemeToggle(getThemeMode());

loadState();
</script>
