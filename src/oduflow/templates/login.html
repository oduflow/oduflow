<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oduflow — Sign in</title>
  <script>
    // Resolve the active theme before first paint (follows the OS unless the dashboard
    // toggle stored a choice). See DESIGN.md §2 (Light theme).
    (function () {
      try {
        var stored = localStorage.getItem('oduflow-theme');
        var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
        var eff = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : mode;
        document.documentElement.dataset.theme = eff;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/static/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="/static/icon.png" type="image/png" sizes="32x32">
  <style>
    @font-face {
      font-family: "Source Sans 3";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/source-sans-3-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      /* "The Engineer's Console" tokens — shared with the dashboard (see DESIGN.md) */
      --bg: oklch(0.07 0.01 260);
      --surface-raised: oklch(0.16 0.012 260);
      --border: oklch(0.3 0.013 260);
      --border-raised: oklch(0.34 0.015 260);
      --text: oklch(0.93 0.005 260);
      --text-dim: oklch(0.7 0.01 260);
      --accent: oklch(0.6 0.2 260);
      --red: oklch(0.65 0.22 25);
      --accent-fg: #fff;
      --shadow-modal: 0 24px 64px rgba(0,0,0,0.65);
      --radius: 0.625rem;
      --radius-sm: 0.425rem;
      --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent) 50%, transparent);
    }
    /* Light theme — mirrors the dashboard (see DESIGN.md §2); resolved in the head script. */
    :root[data-theme="light"] {
      --bg: oklch(0.97 0.004 260);
      --surface-raised: oklch(1 0 0);
      --border: oklch(0.9 0.006 260);
      --border-raised: oklch(0.86 0.008 260);
      --text: oklch(0.25 0.02 260);
      --text-dim: oklch(0.48 0.02 260);
      --accent: oklch(0.5 0.2 260);
      --red: oklch(0.505 0.213 27.5);
      --shadow-modal: 0 24px 64px rgba(15,23,42,0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    :is(button, input):focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: var(--surface-raised);
      border: 1px solid var(--border-raised);
      border-radius: var(--radius);
      box-shadow: var(--shadow-modal);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card img.logo { height: 36px; align-self: center; }
    /* Logo is a white glyph on transparent — darken it to ink on the light card */
    :root[data-theme="light"] .card img.logo { filter: brightness(0); }
    .card h1 {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-family: inherit;
      font-size: 14px;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }
    button {
      margin-top: 6px;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    .error {
      background: color-mix(in oklab, var(--red) 12%, transparent);
      border: 1px solid color-mix(in oklab, var(--red) 30%, transparent);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <img class="logo" src="/logo.png" alt="Oduflow logo">
    <h1>Sign in</h1>
    <!--ERROR-->
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" autofocus required>
    <label for="otp">Authenticator code (if enabled)</label>
    <input id="otp" name="otp" type="text" inputmode="numeric"
           autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
