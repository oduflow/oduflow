##
# Integration test scenarios for Flow.
#
# Each scenario defines:
#   tool            – MCP tool name (from server.py), OR
#   cli             – CLI command name ("init" or "destroy")
#   args            – keyword arguments
#   expect_contains – list of substrings that MUST appear in the result
#   needs_env       – if true, a live Docker environment is set up automatically
#
# Usage:
#   CLI:    flow call <tool_name> [args...]
#   pytest: pytest --run-live-docker tests/test_integration.py -m integration
##

scenarios:

  # ── System (CLI commands, not MCP tools) ──────────────────────────
  init_default:
    cli: init
    marks: [heavyweight]
    args: {}
    expect_contains:
      - "System"

  destroy:
    cli: destroy
    marks: [heavyweight]
    args: {}
    expect_contains:
      - "System"

  # ── Environments ──────────────────────────────────────────────────
  create_env_main:
    tool: create_environment
    marks: [heavyweight]
    args:
      branch: "main"
      env_name: "19.0"
      repo_url: "https://github.com/oduist/oduflow_test.git"
      odoo_image: "odoo:19.0"
    expect_contains:
      - "Environment provisioned"
      - "Database"

  create_env_feature:
    tool: create_environment
    marks: [heavyweight]
    args:
      branch: "main"
      env_name: "feature-login-fix"
      repo_url: "https://github.com/oduist/oduflow_test.git"
      odoo_image: "odoo:19.0"
    expect_contains:
      - "Environment provisioned"

  delete_env:
    tool: delete_environment
    marks: [heavyweight]
    args:
      env_name: "19.0"
    expect_contains:
      - "torn down"

  list_envs:
    tool: list_environments
    needs_env: true
    args: {}
    expect_contains:
      - "19.0 (Status: running)"
      - "Git Branch: main"

  # ── PostgreSQL storage for auxiliary services ───────────────────
  create_service_database:
    tool: create_service_database
    args:
      name: "integration-data"
    expect_contains:
      - "Service database created successfully"
      - "PGDATABASE=oduflow_service_1_integration-data"
      - "PGUSER=svc_1_integration-data"

  info_main:
    tool: get_environment_info
    needs_env: true
    args:
      env_name: "19.0"
    expect_contains:
      - "Environment Info"

  restart_main:
    tool: restart_environment
    needs_env: true
    args:
      env_name: "19.0"
    expect_contains:
      - "restarted"

  stop_main:
    tool: stop_environment
    needs_env: true
    args:
      env_name: "19.0"
    expect_contains:
      - "stopped"

  start_main:
    tool: start_environment
    needs_env: true
    args:
      env_name: "19.0"
      wait: false
    expect_contains:
      - "started"

  # Each scenario gets a freshly created environment on 'main'
  # (live_environment is function-scoped), so a switch cannot be staged by a
  # previous scenario. Cover the two entry states from one starting point: a
  # real switch to another branch, and the idempotent call for the branch the
  # environment is already on (documented to pull instead of failing).
  switch_branch_away:
    tool: switch_branch
    needs_env: true
    args:
      env_name: "19.0"
      branch: "18.0"
    expect_contains:
      - "Switched '19.0' from 'main' to '18.0'"

  switch_branch_same:
    tool: switch_branch
    needs_env: true
    args:
      env_name: "19.0"
      branch: "main"
    expect_contains:
      - "already on branch 'main'; pulled it instead"

  # ── Odoo operations ──────────────────────────────────────────────
  logs_main:
    tool: get_environment_logs
    needs_env: true
    args:
      env_name: "19.0"
      n_lines: 50
    expect_contains:
      - "Odoo version 19.0"

  # Mints a real Odoo session in the live container and checks the cookie
  # payload comes back — the passwordless "Connect as user" (issue #78). Runs
  # against odoo:19.0 (post-17 HTTP stack), the version drift this exercises.
  connect_as_user_admin:
    tool: connect_as_user
    needs_env: true
    args:
      env_name: "19.0"
      user: "admin"
    expect_contains:
      - "Connected as admin"
      - "session_id"
      - "/web"

  test_modules:
    tool: run_odoo_tests
    needs_env: true
    args:
      env_name: "19.0"
      modules: "base"
      test_tags: "/base:TestMergeSequences.test_merge_sequences"
      summary_only: true
    expect_contains:
      - "0 failed, 0 error(s) of 1 test"

  install_modules:
    tool: install_odoo_modules
    marks: [heavyweight]
    needs_env: true
    args:
      env_name: "19.0"
      modules: "sale,crm"
    expect_contains:
      - "Modules installed"

  upgrade_modules:
    tool: upgrade_odoo_modules
    marks: [heavyweight]
    needs_env: true
    args:
      env_name: "19.0"
      modules: "base"
    expect_contains:
      - "Success. Modules: base"
