name: Publish PostgreSQL image

on:
  push:
    branches: [main]
    paths:
      - "docker/postgres/**"
      - ".github/workflows/publish-postgres.yml"
  workflow_dispatch:

concurrency:
  group: publish-postgres
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable image version
        id: ver
        run: |
          version="$(sed -n 's/^ARG POSTGRES_IMAGE_VERSION=//p' docker/postgres/Dockerfile)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -F "DEFAULT_PROD_POSTGRES_IMAGE = \"oduist/oduflow-postgres:$version\"" src/oduflow/settings.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        run: |
          url="https://hub.docker.com/v2/repositories/oduist/oduflow-postgres/tags/${{ steps.ver.outputs.version }}"
          status="$(curl --silent --show-error --output /tmp/postgres-tag.json --write-out '%{http_code}' "$url")"
          if [ "$status" != 404 ]; then
            echo "Image tag already exists or registry lookup failed (HTTP $status); bump POSTGRES_IMAGE_VERSION for a new release" >&2
            exit 1
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: oduist/oduflow-postgres:${{ steps.ver.outputs.version }}
