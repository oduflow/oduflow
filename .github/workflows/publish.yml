name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Verify production PostgreSQL image is published
        run: |
          image="$(sed -n 's/^DEFAULT_PROD_POSTGRES_IMAGE = "\([^"]*\)"/\1/p' src/oduflow/settings.py)"
          test -n "$image"
          docker manifest inspect "$image" >/dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
