name: Frontend

# The shared-environment workspace (frontend/workspace) is built with Node, but
# its build is committed under src/oduflow/templates/static/workspace/ so that
# installing or running Oduflow never needs Node. This keeps that build honest:
# type-check, unit tests, then rebuild and fail if the result differs from what
# is committed. The bundle embeds static/acp-client.js, so a change there must
# be rebuilt too.

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "src/oduflow/templates/static/workspace/**"
      - "src/oduflow/templates/static/acp-client.js"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "src/oduflow/templates/static/workspace/**"
      - "src/oduflow/templates/static/acp-client.js"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/workspace

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/workspace/.nvmrc
          cache: npm
          cache-dependency-path: frontend/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed build is up to date
        working-directory: .
        run: |
          git add -N src/oduflow/templates/static/workspace
          if ! git diff --exit-code --stat -- src/oduflow/templates/static/workspace; then
            echo "::error::The committed workspace build is stale. Run 'npm run build' in frontend/workspace and commit the result."
            exit 1
          fi
